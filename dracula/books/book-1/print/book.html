<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-400-normal.woff2)}
@font-face{font-family:G;font-style:italic;src:url(node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-400-italic.woff2)}
@font-face{font-family:G;font-weight:600;src:url(node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-500-normal.woff2)}
@font-face{font-family:C;src:url(node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-300-normal.woff2)}
@font-face{font-family:M;src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2)}
@page{size:11in 8.5in;margin:0}
:root{--ivory:#f5eee0;--ink:#2a2018;--gold:#a8823f;--red:#8a1020;--night:#141a2e}
*{box-sizing:border-box}
html,body{margin:0;background:#555}
.pg{width:11in;height:8.5in;position:relative;overflow:hidden;background:var(--ivory);color:var(--ink);page-break-after:always;font:11.2pt/1.42 G;margin:0 auto}
.night{background:var(--night);color:#e9e1d2}
.flow{position:absolute;top:.95in;bottom:.9in;column-count:2;column-gap:.42in;column-fill:auto;overflow:hidden;hyphens:auto;text-align:justify}
.L .flow{left:.75in;right:.95in}.R .flow{left:.95in;right:.75in}
.flow p{margin:0;text-indent:1.3em}
.flow p.first{text-indent:0}
.flow p.cont{text-indent:0}
.flow h2{font:300 22pt/1.1 C;letter-spacing:.04em;margin:.18in 0 .1in;text-align:left;column-span:none}
.flow h3{font:italic 13pt G;margin:.12in 0 .04in}
.flow img.inl{width:100%;display:block;margin:.08in 0 .1in;border-radius:1px}
.flow img.orn{width:100%;display:block;margin:.12in 0 .04in}
.flow ul{margin:.04in 0 .06in;padding-left:1.1em;text-align:left}
.flow table{width:100%;border-collapse:collapse;font-size:10pt;margin:.06in 0 .1in;text-align:left}
.flow td{padding:2px 0;border-bottom:1px solid #d9ccb3}.flow td:first-child{font-style:italic;padding-right:.15in}
.rh{position:absolute;top:.48in;font:8pt M;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.L .rh{left:.75in}.R .rh{right:.75in}
.fo{position:absolute;bottom:.45in;font:9pt G;color:#7a6a55}.L .fo{left:.75in}.R .fo{right:.75in}
.night .fo{color:#8d8aa0}
.art{position:absolute;left:0;right:0;top:.95in;height:6.19in;background:center/cover no-repeat}
.cap{position:absolute;left:0;right:0;bottom:.5in;text-align:center;font:italic 11pt G;color:#b9ad95;padding:0 1.4in}
.bleed{position:absolute;inset:0;background:center/cover no-repeat}
.ttl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.k{font:8.5pt M;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
.big{font:300 76pt/1 C;letter-spacing:.12em;margin:.18in 0}
.rule{width:.6in;height:1px;background:var(--gold);margin:.2in auto}
.cross{width:.32in;height:.5in;position:relative;margin:0 auto .2in}
.cross:before{content:"";position:absolute;left:50%;top:0;width:2px;height:100%;background:var(--red);transform:translateX(-50%)}
.cross:after{content:"";position:absolute;left:0;top:28%;width:100%;height:2px;background:var(--red)}
.cross i{position:absolute;left:50%;top:28%;width:.15in;height:.15in;border:1.6px solid var(--red);border-radius:50%;transform:translate(-50%,-50%)}
.opener{position:absolute;left:.95in;right:.75in;top:.75in;height:2.55in}
.opener .num{font:300 64pt/1 C;margin:.06in 0}
.dc{float:left;font:300 52pt/0.8 C;margin:.06in .08in 0 0;color:var(--red)}
.qr{position:absolute;right:.75in;top:.8in;width:1.05in;text-align:center;font:7pt M;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.qr img{width:1.05in;height:1.05in;display:block;margin-bottom:.05in}
</style></head><body><div id="book"></div>
<script>
const D=__DATA__;
(async()=>{
const srcs=[];JSON.stringify(D).replace(/src=\\?"([^"\\]+)/g,(m,a)=>srcs.push(a));
await Promise.all(srcs.map(u=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=u})));
await document.fonts.ready;
const book=document.getElementById('book');let pn=0;
function page(cls){pn++;const d=document.createElement('div');d.className='pg '+(pn%2?'R':'L')+(cls?' '+cls:'');book.appendChild(d);return d}
function foot(p,rh){if(rh){const h=document.createElement('div');h.className='rh';h.textContent=rh;p.appendChild(h)}const f=document.createElement('div');f.className='fo';f.textContent=pn;p.appendChild(f)}
function over(fl){return fl.scrollWidth>fl.clientWidth+2}
function flow(blocks,mk){ // blocks: {html, kind, cue}
  let q=blocks.slice(),pages=[];
  while(q.length){
    const {p,fl}=mk();const cues=[];pages.push({p,cues});
    while(q.length){
      const b=q[0];const el=document.createElement('div');el.innerHTML=b.html;const node=el.firstElementChild;fl.appendChild(node);
      if(!over(fl)){q.shift();if(b.cue)cues.push(b.cue);continue}
      if(node.tagName==='P'){ // split by words
        const words=b.words;let lo=0,hi=words.length;
        while(lo<hi){const m=(lo+hi+1)>>1;node.innerHTML=words.slice(0,m).join(' ');if(over(fl))hi=m-1;else lo=m}
        if(lo>3){node.innerHTML=words.slice(0,lo).join(' ');if(b.cue)cues.push(b.cue);
          const rest=words.slice(lo);q[0]={html:'<p class="cont">'+rest.join(' ')+'</p>',words:rest,cue:b.cue};}
        else fl.removeChild(node);
      } else {fl.removeChild(node);const last=fl.lastElementChild;if(last&&/^H[23]$/.test(last.tagName)&&fl.children.length>1){fl.removeChild(last);q.unshift({html:last.outerHTML,words:null})}}
      break;
    }
  }
  return pages;
}
function P(t,cls){const w=t.split(' ');return {html:'<p'+(cls?' class="'+cls+'"':'')+'>'+t+'</p>',words:w}}
// front matter: one title page over the storm
let p=page('night');p.innerHTML='<div class="bleed" style="background-image:url(title-sea.png)"></div><div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 45%,rgba(8,10,16,.55) 100%)"></div><div style="position:absolute;right:.7in;top:1.15in;width:4.9in;text-align:center;color:#efe7d8"><div class="cross"><i></i></div><div class="k">Bram Stoker</div><div class="big" style="color:#f1e9da;font-size:60pt;letter-spacing:.1em">DRACULA</div><div class="rule"></div><div class="k">Book I · The Castle</div><div style="height:.35in"></div><div class="k" style="color:#9a927f">Amenti Studios</div></div><div style="position:absolute;right:.7in;bottom:.4in;width:5.2in;text-align:right;font:8pt/1.55 G;color:#b3ab98;text-shadow:0 0 6px #000,0 0 2px #000"><i>Dracula</i> by Bram Stoker, first published 1897 · Production, direction and art direction by Ian Ingram<br>Voices from the Library of Legends, spoken by the Amenti Speech Engine · © 2026 Ingram Manor LLC · ISBN to come</div>';
// foreword
const F=D.foreword;let fpages=flow(F,()=>{const p=page();const fl=document.createElement('div');fl.className='flow';p.appendChild(fl);foot(p,'Keys to this Blood');return {p,fl}});
// chapter opener must start on a left page (card), so next page number even
if(pn%2===0){const b=page();b.innerHTML='<div class="ttl"><img src="fw-ornament-4.png" style="width:5in"></div>'} // blank right? (pn even means last was left) -> add blank right so card lands left
p=page('night');p.innerHTML='<div class="art" style="background-image:url(ad/part-1/cards/book1-ch1.jpg)"></div>';
// opener right page + chapter text
const T=D.paras.map((x,i)=>{const b=P(x.t,i===0?'first':'');b.cue=x.cue;if(i===0){b.html='<p class="first"><span class="dc">'+x.t[0]+'</span>'+x.t.slice(1)+'</p>';b.words=null}return b});
T[0].words=null;
let first=true;const used=new Set();const pairs=[];
function pick(cues){const c=cues.length?cues[Math.floor(cues.length/2)]:1;const keys=Object.keys(D.pics).map(Number).sort((a,b)=>a-b);
  let best=null;for(const k of keys){if(k<=c)best=k}
  for(let k=keys.indexOf(best);k<keys.length;k++){for(const im of D.pics[keys[k]]){if(!used.has(im)){used.add(im);return im}}}return null}
const tp=flow(T,()=>{
  if(first){first=false;const p=page();p.innerHTML='<div class="opener"><div class="k">Chapter</div><div class="num">I</div><div class="k" style="letter-spacing:.3em">Jonathan Harker’s Journal</div><div style="font:italic 10pt G;color:#7a6a55;margin-top:.1in">(Kept in shorthand.)</div></div><div class="qr"><img src="qr1.png">Play this chapter</div>';
    const fl=document.createElement('div');fl.className='flow';fl.style.top='3.4in';p.appendChild(fl);foot(p);return {p,fl}}
  const p=page();const fl=document.createElement('div');fl.className='flow';p.appendChild(fl);foot(p,'Dracula · Book I');
  const r=page('night');foot(r);pairs.push({p,r});return {p,fl}});
for(const t of tp){const pr=pairs.find(x=>x.p===t.p);if(!pr)continue;const im=pick(t.cues);pr.r.insertAdjacentHTML('afterbegin',im?'<div class="art" style="background-image:url(art/'+im+')"></div>':'');pr.r.dataset.im=im||''}
document.title='done';
})();
</script></body></html>
